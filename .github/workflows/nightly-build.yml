name: Nightly Podman Build with ImageFS Plugin

on:
  schedule:
    # Run at 2:17 AM UTC every night
    - cron: "17 2 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.compare.outputs.should_build }}
      podman_sha: ${{ steps.fetch.outputs.podman_sha }}
      container_libs_sha: ${{ steps.fetch.outputs.container_libs_sha }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v6

      - name: Fetch current upstream SHAs
        id: fetch
        run: |
          PODMAN_SHA=$(git ls-remote https://github.com/podman-container-tools/podman.git refs/heads/main | cut -f1)
          CONTAINER_LIBS_SHA=$(git ls-remote https://github.com/redhat-hpc/container-libs.git refs/heads/imagefs-plugin | cut -f1)
          echo "podman_sha=$PODMAN_SHA" >> $GITHUB_OUTPUT
          echo "container_libs_sha=$CONTAINER_LIBS_SHA" >> $GITHUB_OUTPUT
          echo "Podman SHA:        $PODMAN_SHA"
          echo "Container-libs SHA: $CONTAINER_LIBS_SHA"

      - name: Compare with last built SHAs
        id: compare
        run: |
          LAST_PODMAN_SHA=""
          LAST_CONTAINER_LIBS_SHA=""

          if [ -f .last-built-shas ]; then
            LAST_PODMAN_SHA=$(grep "^podman=" .last-built-shas | cut -d= -f2)
            LAST_CONTAINER_LIBS_SHA=$(grep "^container_libs=" .last-built-shas | cut -d= -f2)
          fi

          echo "Last built podman SHA:        ${LAST_PODMAN_SHA:-<never built>}"
          echo "Last built container-libs SHA: ${LAST_CONTAINER_LIBS_SHA:-<never built>}"

          if [ "${{ steps.fetch.outputs.podman_sha }}" = "$LAST_PODMAN_SHA" ] && \
             [ "${{ steps.fetch.outputs.container_libs_sha }}" = "$LAST_CONTAINER_LIBS_SHA" ]; then
            echo "No changes detected in either repo. Skipping build."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected. Triggering build."
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  prepare:
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      build_datetime: ${{ steps.version.outputs.build_datetime }}
    steps:
      - name: Generate version info
        id: version
        run: |
          echo "build_datetime=$(date -u +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          echo "release_tag=nightly-$(date -u +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT

  build-matrix:
    needs: [check-changes, prepare]
    if: needs.check-changes.outputs.should_build == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rhel_version: "8"
            container: "registry.access.redhat.com/ubi8/go-toolset"
          - rhel_version: "9"
            container: "registry.access.redhat.com/ubi9/go-toolset"
          - rhel_version: "10"
            container: "registry.access.redhat.com/ubi10/go-toolset"
    container:
      image: ${{ matrix.container }}
      options: --user root
    permissions:
      contents: write

    steps:
      - name: Install build dependencies
        run: |
          dnf install -y \
            git \
            make \
            gcc \
            libseccomp-devel \
            libselinux-devel \
            gpgme-devel \
            device-mapper-devel \
            pkg-config \
            systemd-devel

      - name: Checkout Podman main
        uses: actions/checkout@v6
        with:
          repository: podman-container-tools/podman
          ref: ${{ needs.check-changes.outputs.podman_sha }}
          path: podman

      - name: Clone and replace container-libs with imagefs-plugin branch
        working-directory: podman
        run: |
          # Clone the custom container-libs fork at the exact SHA detected
          git clone --depth 1 --branch imagefs-plugin https://github.com/redhat-hpc/container-libs.git /tmp/container-libs
          git -C /tmp/container-libs checkout ${{ needs.check-changes.outputs.container_libs_sha }}

          # Replace with local path
          go mod edit -replace go.podman.io/storage=/tmp/container-libs/storage

          go mod tidy
          go mod vendor

      - name: Build Podman for linux/amd64
        working-directory: podman
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 1
          BUILDTAGS: "seccomp selinux systemd exclude_graphdriver_btrfs"
        run: |
          make podman

      - name: Get Podman version
        id: podman_version
        working-directory: podman
        run: |
          echo "version=$(./bin/podman --version)" >> $GITHUB_OUTPUT

      - name: Package binary
        working-directory: podman
        run: |
          mkdir -p release
          cp bin/podman release/podman-rhel${{ matrix.rhel_version }}-amd64
          chmod +x release/podman-rhel${{ matrix.rhel_version }}-amd64
          cd release
          tar -czf podman-rhel${{ matrix.rhel_version }}-amd64.tar.gz podman-rhel${{ matrix.rhel_version }}-amd64
          sha256sum podman-rhel${{ matrix.rhel_version }}-amd64.tar.gz > podman-rhel${{ matrix.rhel_version }}-amd64.tar.gz.sha256

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: Nightly Build ${{ needs.prepare.outputs.build_datetime }}
          files: |
            podman/release/podman-rhel${{ matrix.rhel_version }}-amd64.tar.gz
            podman/release/podman-rhel${{ matrix.rhel_version }}-amd64.tar.gz.sha256
          draft: false
          prerelease: true

  finalize-release:
    needs: [check-changes, prepare, build-matrix]
    if: needs.check-changes.outputs.should_build == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v6

      - name: Update release description
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: Nightly Build ${{ needs.prepare.outputs.build_datetime }}
          body: |
            ## Podman Nightly Build with ImageFS Plugin

            **Build Date**: ${{ needs.prepare.outputs.build_datetime }} UTC
            **Architecture**: linux/amd64

            ### Source SHAs
            - **podman-container-tools/podman**: `${{ needs.check-changes.outputs.podman_sha }}`
            - **redhat-hpc/container-libs** (imagefs-plugin): `${{ needs.check-changes.outputs.container_libs_sha }}`

            ### Configuration
            - **Base**: podman-container-tools/podman (main branch)
            - **Container-libs**: redhat-hpc/container-libs (imagefs-plugin branch)

            ### Available Builds

            | RHEL Version | Files |
            |--------------|-------|
            | RHEL 8 | `podman-rhel8-amd64.tar.gz` + `.sha256` |
            | RHEL 9 | `podman-rhel9-amd64.tar.gz` + `.sha256` |
            | RHEL 10 | `podman-rhel10-amd64.tar.gz` + `.sha256` |

            Download the appropriate binary for your RHEL version.

            Built using Red Hat Universal Base Image (UBI) Go toolset containers.
          draft: false
          prerelease: true

      - name: Record successfully built SHAs
        run: |
          cat > .last-built-shas << EOF
          podman=${{ needs.check-changes.outputs.podman_sha }}
          container_libs=${{ needs.check-changes.outputs.container_libs_sha }}
          EOF

      - name: Commit updated SHAs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last-built-shas
          git commit -m "chore: record built SHAs [skip ci]" || echo "Nothing to commit"
          git push
